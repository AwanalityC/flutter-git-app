name: shadow_diary
description: A mood diary where you drag the sun instead of picking an emoji.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Phase 4 will need this — already added so you don't have to stop and
  # edit pubspec.yaml later. Run `flutter pub get` after copying this file in.
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true